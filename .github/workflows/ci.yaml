name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        only-new-issues: true

  unit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
    - name: unit-test
      run: make unit
    - uses: gwatts/go-coverage-action@v2
      id: coverage
      with:
        coverage-threshold: 70
        fail-coverage: true
        test-pkgs: ./pkg/...
        test-args: '["-short", "-vet=off"]'
        ignore-pattern: |
          .*/stubs/.*$
          .*/.*fakes/.*$
          .*/executor/.*$
          .*/config/.*$
          .*/image/.*$
          .*/containerd/.*$

  build:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Skipping build step"

  integration:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Skipping integration step"

  draft-release:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    if: github.ref_name == 'main'
    permissions:
      contents: write
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.SERVICE_USER_GITHUB_TOKEN }}
