name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        only-new-issues: true

  unit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
    - name: unit-test
      run: make unit
    - uses: gwatts/go-coverage-action@v2
      id: coverage
      with:
        coverage-threshold: 70
        fail-coverage: true
        test-pkgs: ./pkg/...
        test-args: '["-short", "-vet=off"]'
        ignore-pattern: |
          .*/stubs/.*$
          .*/.*fakes/.*$
          .*/executor/.*$
          .*/config/.*$
          .*/image/.*$
          .*/containerd/.*$

  build:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Skipping build step"

  integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
    - uses: actions/checkout@v7
      with:
        repository: cloudfoundry/diego-release
        path: diego-release
        submodules: true
    - uses: actions/checkout@v7
      with:
        repository: cloudfoundry/cf-k8s-releases
        path: cf-k8s-releases
    - name: Bump diego-release's k8s-garden-client to the commit under test
      working-directory: ${{ github.workspace }}/diego-release/src/code.cloudfoundry.org
      run: |
        go get code.cloudfoundry.org/k8s-garden-client/...@${{ github.event.pull_request.head.sha || github.sha }}
        go mod vendor
    - name: Build rep image
      id: rep
      working-directory: ${{ github.workspace }}/cf-k8s-releases/diego
      env:
        BUILDX_BAKE_ENTITLEMENTS_FS: "0"
      run: |
        docker buildx bake rep --load \
          --set rep.contexts.src="${{ github.workspace }}/diego-release/src" \
          --set rep.contexts.config="${{ github.workspace }}/diego-release/config"
        echo "list=$(docker buildx bake rep --print | jq -r '[.target[].tags[]] | join(",")')" >> "$GITHUB_OUTPUT"
    - name: Pin diego helm chart to the built rep
      working-directory: ${{ github.workspace }}/cf-k8s-releases
      run: |
        yq -e -i '.rep.image.repository = "rep"' diego/helm/values.yaml
        cat > ${{ github.workspace }}/state-values.yaml <<EOF
        charts:
          diego:
            url: ${{ github.workspace }}/cf-k8s-releases/diego/helm
        EOF
    - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        load-images: ${{ steps.rep.outputs.list }}
        additional-values-files: ${{ github.workspace }}/state-values.yaml
    - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf-tests@main
      with:
        test-repo: cf-smoke-tests
        test-branch: main
        config-template: ${{ github.workspace }}/kind-deployment/.github/smoke-config.tpl
        config-output: ${{ github.workspace }}/.github/smoke-config.json
    - name: run smoke tests
      env:
        CONFIG: "${{ github.workspace }}/.github/smoke-config.json"
        GINKGO_NO_COLOR: "true"
      run: |
        ./cf-smoke-tests/bin/test --no-color --github-output --timeout=30m --procs=4 --json-report report.json
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: smoke-test-report
        path: ./cf-smoke-tests/report.json

  draft-release:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    if: github.ref_name == 'main'
    permissions:
      contents: write
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.SERVICE_USER_GITHUB_TOKEN }}
