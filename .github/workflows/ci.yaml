name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
    - name: Evaluate Go version
      shell: bash
      run: |
        GOVERSION=$(go version | awk '{print $3}' | sed 's/\.[0-9]*$//')
        echo "GOFLAGS=-gcflags=all=-lang=${GOVERSION}" >> $GITHUB_ENV
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        only-new-issues: true

  unit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
    - name: Evaluate Go version
      shell: bash
      run: |
        GOVERSION=$(go version | awk '{print $3}' | sed 's/\.[0-9]*$//')
        echo "GOFLAGS=-gcflags=all=-lang=${GOVERSION}" >> $GITHUB_ENV
    - name: unit-test
      run: make unit
    - uses: gwatts/go-coverage-action@v2
      id: coverage
      with:
        coverage-threshold: 70
        fail-coverage: true
        test-pkgs: ./pkg/...
        test-args: '["-short", "-vet=off"]'
        ignore-pattern: |
          .*/stubs/.*$
          .*/.*fakes/.*$
          .*/executor/.*$
          .*/config/.*$
          .*/image/.*$
          .*/containerd/.*$

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
    - name: Build container image
      run: make image

  integration:
    runs-on: ubuntu-latest
    needs: [lint, unit, build]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set kernel settings
      run: |
        docker run --rm \
          --privileged \
          --pid host \
          alpine sh -c "sysctl -w fs.inotify.max_user_instances=512"
    - name: Install CF CLI
      run: |
        mkdir -p $HOME/.local/bin && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=${CF_CLI_VERSION}&source=github" | tar -zx
        mv cf8 $HOME/.local/bin/cf
      env:
        # renovate: dataSource=github-releases depName=cloudfoundry/cli
        CF_CLI_VERSION: "8.19.0"
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
    - name: checkout CF test repository
      uses: actions/checkout@v7
      with:
        repository: cloudfoundry/cf-smoke-tests
        ref: main
        path: cf-smoke-tests
    - name: Run integration tests
      run: make integration
    - name: debug pods
      if: failure()
      run: |
        echo "===== k8s-rep ====="
        kubectl get pod -n cf-system -l app=k8s-rep -o wide
        kubectl logs -n cf-system -l app=k8s-rep

  draft-release:
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.ref_name == 'main'
    permissions:
      contents: write
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.SERVICE_USER_GITHUB_TOKEN }}
